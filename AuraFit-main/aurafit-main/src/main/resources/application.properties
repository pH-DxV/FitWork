# configuracao do bd
quarkus.datasource.db-kind = postgresql
quarkus.datasource.username = ${DB_USER:topicos2}
quarkus.datasource.password = ${DB_PASSWORD:123456}
quarkus.datasource.jdbc.url = ${DB_URL:jdbc:postgresql://localhost:5432/topicos2db}

%dev.quarkus.hibernate-orm.database.generation=drop-and-create

# desabilitar o docker
quarkus.devservices.enabled=false

%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.log.bind-parameters=true

# configuracao do cors (front-end Angular em http://localhost:4200)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,PUT,POST,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.exposed-headers=Authorization, Content-Disposition, X-Page, X-Page-Size, X-Total-Count
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# base url para o campo "type" das respostas de erro (RFC 7807)
problem.base-url=http://localhost:8080
# %prod.problem.base-url=https://api.aurafit.com.br
