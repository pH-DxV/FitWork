<section class="pagina">
  <header class="topo-pagina">
    <div>
      <h1>Sabores</h1>
      <p class="subtitulo">Sabores disponíveis para os produtos.</p>
    </div>
    <a mat-flat-button routerLink="/admin/sabores/novo">
      <mat-icon>add</mat-icon>
      Novo sabor
    </a>
  </header>

  <div class="cartao">
    <mat-form-field appearance="outline" class="c4" style="width: 100%">
      <mat-label>Buscar por nome</mat-label>
      <input matInput #campoBusca (input)="buscar(campoBusca.value)" placeholder="Ex.: Chocolate" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    @if (erro()) {
      <p class="mensagem-erro">{{ erro() }}</p>
    }

    <div class="tabela-container">
      <table mat-table [dataSource]="sabores()" class="tabela">
        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let sabor"><strong>{{ sabor.nome }}</strong></td>
        </ng-container>

        <ng-container matColumnDef="descricao">
          <th mat-header-cell *matHeaderCellDef>Descrição</th>
          <td mat-cell *matCellDef="let sabor">{{ sabor.descricao ?? '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="acoes">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let sabor" class="acoes">
            <a mat-icon-button [routerLink]="['/admin/sabores/editar', sabor.id]" aria-label="Editar">
              <mat-icon>edit</mat-icon>
            </a>
            <button mat-icon-button (click)="excluir(sabor)" aria-label="Excluir">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="colunas"></tr>
        <tr mat-row *matRowDef="let linha; columns: colunas"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell vazio" [attr.colspan]="colunas.length">
            {{ carregando() ? 'Carregando...' : 'Nenhum sabor encontrado.' }}
          </td>
        </tr>
      </table>
    </div>

    <mat-paginator
      [length]="totalItems()"
      [pageIndex]="pageIndex()"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[5, 10, 20]"
      (page)="mudarPagina($event)"
    />
  </div>
</section>
