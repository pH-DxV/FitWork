# configuracao do bd
quarkus.datasource.db-kind = postgresql
quarkus.datasource.username = ${DB_USER:topicos2}
quarkus.datasource.password = ${DB_PASSWORD:123456}
quarkus.datasource.jdbc.url = ${DB_URL:jdbc:postgresql://localhost:5432/topicos2db}

%dev.quarkus.hibernate-orm.database.generation=drop-and-create

# desabilitar o docker
quarkus.devservices.enabled=false

%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.log.bind-parameters=true

# configuracao do cors (front-end Angular em http://localhost:4200)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,PUT,POST,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.exposed-headers=Location, Content-Disposition
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# base url para o campo "type" das respostas de erro (RFC 7807)
problem.base-url=http://localhost:8080
# %prod.problem.base-url=https://api.fitwork.com.br

# limite de upload HTTP multipart
quarkus.http.limits.max-body-size=10M

# configuracao do Object Storage S3 (RustFS local)
fitwork.storage.endpoint=${S3_ENDPOINT:http://localhost:9000}
fitwork.storage.region=${S3_REGION:us-east-1}
fitwork.storage.access-key=${S3_ACCESS_KEY:fitwork}
fitwork.storage.secret-key=${S3_SECRET_KEY:fitwork123}
fitwork.storage.bucket=${S3_BUCKET:fitwork-arquivos}

# ======================================================================
# Segurança: Keycloak (IAM) via OAuth 2.0 / OpenID Connect
# O Angular NUNCA conversa com o Keycloak: toda a comunicação passa pelo back-end.
# Segredos vêm de variáveis de ambiente; os valores padrão servem apenas para dev local.
# ======================================================================
fitwork.keycloak.url=${KEYCLOAK_URL:http://localhost:8180}
fitwork.keycloak.realm=${KEYCLOAK_REALM:fitwork}
fitwork.keycloak.client-id=${KEYCLOAK_CLIENT_ID:fitwork-backend}
fitwork.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:fitwork-backend-dev-secret}

# validação dos access tokens (Bearer) enviados pelo Angular
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${fitwork.keycloak.url}/realms/${fitwork.keycloak.realm}
quarkus.oidc.client-id=${fitwork.keycloak.client-id}
quarkus.oidc.credentials.secret=${fitwork.keycloak.client-secret}
# o token precisa ter sido emitido PARA este back-end (claim "aud")
quarkus.oidc.token.audience=${fitwork.keycloak.client-id}
# papéis (ADMIN / CLIENTE) ficam em realm_access.roles no token do Keycloak
quarkus.oidc.roles.role-claim-path=realm_access/roles

# autorização negada por padrão: endpoint sem @PermitAll/@RolesAllowed/@Authenticated = 403
quarkus.security.jaxrs.deny-unannotated-endpoints=true
# autenticação "preguiçosa": permite que os ExceptionMappers padronizem os 401/403 (RFC 7807)
quarkus.http.auth.proactive=false

# cookie HttpOnly que guarda o refresh token (invisível ao JavaScript do navegador)
fitwork.auth.cookie-name=FITWORK_RT
fitwork.auth.cookie-path=/auth
fitwork.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
# em dev local o Angular/Quarkus rodam em http://localhost (sem HTTPS)
%dev.fitwork.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}

# botão "Authorize" (Bearer) no Swagger UI
quarkus.smallrye-openapi.security-scheme=jwt
